<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美術專案管理</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --line2:#eef0f3; --ink:#1f2328; --ink2:#59636e; --ink3:#8b949e;
  --accent:#3b5bdb; --accent-soft:#e7ecff; --danger:#d6336c; --danger-soft:#fde8ef; --warn:#e8590c; --warn-soft:#fff0e3;
  --ok:#2f9e44; --ok-soft:#e6f6e9;
  --s-todo:#ffffff; --s-todo-b:#ced4da; --s-doing:#ffd43b; --s-review:#74c0fc; --s-done:#69db7c; --s-hold:#adb5bd; --s-cancel:#e9ecef;
  --up:#f59f00; --down:#7048e8;
  --r:8px; --font: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}

/* 頂部 */
header{position:sticky;top:0;z-index:30;background:#1f2328;color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;height:52px}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:#c9d1d9;padding:14px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:#748ffc;font-weight:600}
.me{font-size:12px;color:#c9d1d9;white-space:nowrap;display:flex;gap:8px;align-items:center}
.sync{background:#f59f00;color:#1f2328;border-radius:10px;padding:1px 8px;font-weight:600}
.me .role{background:#343a40;border-radius:10px;padding:1px 8px}
.iconbtn{background:none;border:1px solid #495057;color:#fff;border-radius:6px;padding:4px 8px}

main{padding:16px;max-width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.toolbar input[type=search]{min-width:180px}
.field{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;min-height:34px}
select.field{padding-right:24px;max-width:200px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;min-height:34px;white-space:nowrap}
.btn:hover{border-color:#adb5bd}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#f3c1d2}
.btn.small{min-height:28px;padding:3px 10px;font-size:13px}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;user-select:none}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* 狀態 */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.st-未開始{background:var(--s-todo);border-color:var(--s-todo-b);color:var(--ink2)}
.st-進行中{background:var(--s-doing);color:#5c4400}
.st-待驗收{background:var(--s-review);color:#073763}
.st-完成{background:var(--s-done);color:#0b3d17}
.st-暫停{background:var(--s-hold);color:#212529}
.st-取消{background:var(--s-cancel);color:var(--ink3);text-decoration:line-through}
.tag{display:inline-block;background:#f1f3f5;color:var(--ink2);border-radius:4px;padding:0 6px;font-size:12px;margin-right:4px}
.warnmark{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;border-radius:10px;padding:1px 7px}
.warnmark.d{background:var(--danger-soft);color:var(--danger)}
.warnmark.w{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:0 8px;font-size:12px;margin:1px 3px 1px 0;background:#fff;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip button{border:0;background:none;padding:0 0 0 2px;color:var(--ink3)}

/* 總覽 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.proj{padding:14px 16px;cursor:pointer}
.proj:hover{border-color:#adb5bd}
.proj h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;background:#f1f3f5;border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--ink2)}
.stats b{display:block;font-size:18px;color:var(--ink);font-weight:700}
.stats .bad b{color:var(--danger)} .stats .meh b{color:var(--warn)}
h2.sec{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}

/* 表格 */
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 190px)}
table.tasks{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
table.tasks th{position:sticky;top:0;z-index:2;background:#f8f9fa;color:var(--ink2);font-weight:600;font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tasks td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tasks tr.row{cursor:pointer}
table.tasks tr.row:hover td{background:#f8f9ff}
table.tasks tr.grp td{background:#fbfbfc;font-weight:700;position:sticky;top:33px;z-index:1;cursor:pointer;border-bottom:1px solid var(--line)}
table.tasks tr.grp td .gprog{display:inline-block;vertical-align:middle;width:120px;margin-left:10px}
table.tasks td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tasks td.date{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2)}
td.title{min-width:260px}
td.title .sub{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.late{color:var(--danger)!important;font-weight:600}
.slip{font-size:12px;color:var(--warn);font-weight:600}
.edge{border-left:4px solid transparent}

/* 甘特 */
.gantt{display:flex;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:calc(100vh - 190px);min-height:360px}
.gleft{width:300px;flex:none;border-right:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.gright{flex:1;overflow:auto;position:relative}
.ghead{height:44px;flex:none;border-bottom:1px solid var(--line);background:#f8f9fa;font-size:12px;color:var(--ink2)}
.gleft .ghead{display:flex;align-items:flex-end;padding:0 10px 6px;font-weight:600}
.glist{overflow:hidden;flex:1}
.gname{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line2);font-size:13px;white-space:nowrap;overflow:hidden;cursor:pointer}
.gname.grp{background:#fbfbfc;font-weight:700;color:var(--ink2);font-size:12px}
.gname .o{color:var(--ink3);font-size:12px;margin-left:auto;flex:none}
.gname.sel,.gname:hover{background:#f1f3ff}
.gcanvas{position:relative}
.gtime{position:sticky;top:0;z-index:5;background:#f8f9fa;border-bottom:1px solid var(--line);height:44px}
.gtime div{position:absolute;font-size:11px;color:var(--ink2);white-space:nowrap}
.gbody{position:relative}
.gday{position:absolute;top:0;bottom:0}
.gday.off{background:repeating-linear-gradient(135deg,#f6f7f9 0 4px,#fbfbfc 4px 8px)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:3;opacity:.7}
.grw{position:absolute;left:0;right:0;height:30px;border-bottom:1px solid var(--line2)}
.gbar{position:absolute;height:18px;top:6px;border-radius:4px;border:1px solid rgba(0,0,0,.18);font-size:11px;line-height:16px;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:4;color:#212529}
.gbar.par{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,transparent 3px 7px)}
.gbar.bad{box-shadow:0 0 0 2px var(--danger)}
.gbar.dim,.gname.dim{opacity:.25}
.gbar.up{box-shadow:0 0 0 2px var(--up)}
.gbar.down{box-shadow:0 0 0 2px var(--down)}
.gbar.me{box-shadow:0 0 0 3px #1f2328}
.grel{position:absolute;width:10px;height:10px;transform:rotate(45deg);background:var(--danger);top:10px;z-index:4;margin-left:-5px;border:1px solid #fff}
svg.arrows{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
svg.arrows path{fill:none;stroke:#8b949e;stroke-width:1.2}
svg.arrows path.up{stroke:var(--up);stroke-width:2}
svg.arrows path.down{stroke:var(--down);stroke-width:2}
svg.arrows path.dim{opacity:.12}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle;border:1px solid rgba(0,0,0,.15)}
.chain{position:fixed;right:16px;bottom:16px;width:340px;max-height:50vh;overflow:auto;z-index:20;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.chain h4{margin:0 0 6px;font-size:14px}
.chain ul{margin:4px 0 10px;padding-left:18px;font-size:13px}

/* 人員 */
.prow{position:absolute;left:0;right:0;border-bottom:1px solid var(--line2)}
.pname{display:flex;flex-direction:column;justify-content:center;padding:0 10px;border-bottom:1px solid var(--line2);cursor:pointer;overflow:hidden}
.pname b{font-size:13px} .pname span{font-size:11px;color:var(--ink3);white-space:nowrap}
.pname:hover{background:#f1f3ff}
.leave{position:absolute;top:0;bottom:0;background:rgba(47,158,68,.14);z-index:1}

/* 我的工作 */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.col h3{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between}
.tcard{padding:10px 12px;margin-bottom:8px}
.tcard .t{font-weight:600}
.tcard .m{font-size:12px;color:var(--ink2);margin-top:2px}
.tcard .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.wait{font-size:12px;background:#f8f9fa;border-radius:6px;padding:4px 8px;margin-top:6px;color:var(--ink2)}

/* 抽屜與對話框 */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;z-index:50;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s}
.drawer.open{transform:none}
.drawer .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .hd h3{margin:0;font-size:16px;flex:1}
.drawer .bd{flex:1;overflow:auto;padding:16px 18px}
.drawer .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.form label.full{grid-column:1/-1}
.form .field{width:100%}
.form .ro{background:#f8f9fa;color:var(--ink2)}
.hint{font-size:12px;color:var(--ink3)}
.impact{margin:0 0 14px;border-radius:8px;padding:10px 12px;font-size:13px;background:#f8f9fa}
.impact.bad{background:var(--danger-soft)}
.impact ul{margin:6px 0 0;padding-left:18px}
.warnbox{background:var(--warn-soft);color:#8a3b00;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.warnbox.d{background:var(--danger-soft);color:#8c1d40}
.ac{position:relative}
.ac .list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.ac .list div{padding:6px 10px;cursor:pointer;font-size:13px}
.ac .list div:hover,.ac .list div.hi{background:var(--accent-soft)}
.mask{position:fixed;inset:0;background:rgba(15,20,25,.35);z-index:40}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:12px;z-index:60;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px}
.modal table{border-collapse:collapse;width:100%;font-size:13px}
.modal td,.modal th{border-bottom:1px solid var(--line2);padding:5px 6px;text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 16px;border-radius:8px;z-index:80;max-width:min(560px,calc(100vw - 32px));font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:#a61e4d}
.loading{position:fixed;inset:52px 0 0 0;display:flex;align-items:center;justify-content:center;color:var(--ink2);z-index:10;background:rgba(245,246,248,.7)}
.empty{padding:30px;text-align:center;color:var(--ink3)}

@media (max-width:720px){
  header{gap:8px;padding:0 10px} header h1{display:none}
  main{padding:12px}
  .form{grid-template-columns:1fr}
  .gleft{width:150px}
  .me .nm{display:none}
}
</style>
</head>
<body>
<header>
  <h1>美術專案管理</h1>
  <nav class="tabs" id="tabs">
    <button data-v="dash">總覽</button>
    <button data-v="table">工項表</button>
    <button data-v="gantt">甘特圖</button>
    <button data-v="people">人員排程</button>
    <button data-v="mine">我的工作</button>
    <button data-v="admin" id="tabAdmin" class="hidden">管理</button>
  </nav>
  <div class="me"><span id="sync" class="sync hidden">同步中…</span><span class="nm" id="meName"></span><span class="role" id="meRole"></span><button class="iconbtn" id="reload" title="重新整理">↻</button><button class="iconbtn" id="logout" title="登出">登出</button></div>
</header>
<main id="main"></main>
<div class="loading" id="loading">載入中…</div>

<div class="drawer" id="drawer">
  <div class="hd"><h3 id="dTitle">工項</h3><button class="btn small" id="dClose">關閉</button></div>
  <div class="bd" id="dBody"></div>
  <div class="ft" id="dFoot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/api.js"></script>
<script>
/* ============== 與後端溝通（資料層在 js/api.js） ============== */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  try { return Promise.resolve(API[fn].apply(API, args)); } catch (e) { return Promise.reject(e); }
}
/** 需要時才載入的元件（讀寫 Excel） */
var LIBS = {
  ExcelJS: 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
  XLSX: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
function need(name) {
  if (window[name]) return Promise.resolve();
  return new Promise(function (ok, no) {
    var sc = document.createElement('script'); sc.src = LIBS[name];
    sc.onload = function () { ok(); }; sc.onerror = function () { no(new Error('元件載入失敗，請檢查網路。')); };
    document.head.appendChild(sc);
  });
}

/* ============== 背景存檔（先更新畫面，再依序送出） ============== */
var syncChain = Promise.resolve(), syncCount = 0;
function syncUi() { var el = $('#sync'); if (el) { el.classList.toggle('hidden', !syncCount); el.textContent = '同步中…' + (syncCount > 1 ? '（' + syncCount + '）' : ''); } }
/** patch：要先套到畫面上的欄位；fn(t) 回傳送出的 Promise（送出當下再讀最新的 at，避免版本衝突） */
function saveLater(id, patch, fn, okMsg) {
  var t = byId[id], backup = {};
  Object.keys(patch).forEach(function (k) { backup[k] = t[k]; t[k] = patch[k]; });
  syncCount++; syncUi(); render();
  syncChain = syncChain.then(function () { return fn(byId[id]); }).then(function (r) {
    if (r.task) upsert(r.task);
    applyComputed(r.computed);
    if (okMsg) toast(okMsg);
  }).catch(function (e) {
    Object.keys(backup).forEach(function (k) { t[k] = backup[k]; });
    toast('沒有存成功，已還原：' + (e.message || e), true);
  }).then(function () { syncCount--; syncUi(); if (!$('#drawer').classList.contains('open') && !$('.modal')) render(); });
}

/* ============== 狀態 ============== */
var S = {
  data: null, view: 'dash', project: '', q: '', owner: '', status: '', group: '', hideDone: true, onlyWarn: false,
  collapsed: {}, sel: null, ganttScale: 'day', peopleRange: 90, minePerson: '', peopleProject: ''
};
var byId = {}, succ = {}, projById = {}, personColor = {};
var STATUSES = ['未開始', '進行中', '待驗收', '完成', '暫停', '取消'];
var PALETTE = ['#4dabf7', '#ff8787', '#69db7c', '#ffd43b', '#b197fc', '#ffa94d', '#63e6be', '#f783ac', '#a9e34b', '#74c0fc', '#e599f7', '#ffc078'];
var ST_COLOR = { '未開始': '#e9ecef', '進行中': '#ffd43b', '待驗收': '#74c0fc', '完成': '#69db7c', '暫停': '#adb5bd', '取消': '#f1f3f5' };

try { var saved = JSON.parse(localStorage.getItem('pm-ui') || '{}'); ['view', 'project', 'hideDone', 'ganttScale', 'peopleRange'].forEach(function (k) { if (k in saved) S[k] = saved[k]; }); } catch (e) {}
function remember() { try { localStorage.setItem('pm-ui', JSON.stringify({ view: S.view, project: S.project, hideDone: S.hideDone, ganttScale: S.ganttScale, peopleRange: S.peopleRange })); } catch (e) {} }

/* ============== 工具 ============== */
function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dn(s) { if (!s) return null; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5) : null; }
function ds(n) { var d = new Date(n * 864e5); return d.toISOString().slice(0, 10); }
function md(s) { return s ? s.slice(5).replace('-', '/') : ''; }
function wk(n) { return new Date(n * 864e5).getUTCDay(); }
function isOff(n) { var s = ds(n); if (S.data.makeup[s]) return false; var w = wk(n); return w === 0 || w === 6 || !!S.data.holidays[s]; }
function split(s) { return String(s || '').split(/[\s,，、;；]+/).filter(Boolean); }
function toast(msg, err) {
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, err ? 6000 : 2600);
}
function busy(on) { $('#loading').classList.toggle('hidden', !on); }
function fail(e) { busy(false); toast(e.message || String(e), true); }
function sev(w) {
  if (/^(循環|超過出版日|找不到前置|前置不能)/.test(w)) return 'd';
  if (/^(進度落後|比基準晚|排序衝突|已開始，但|前置暫停|未指派)/.test(w)) return 'w';
  return 'w';
}
function worst(t) { var s = ''; (t.warns || []).forEach(function (w) { var v = sev(w); if (v === 'd') s = 'd'; else if (!s) s = v; }); return s; }
function canEdit(t) { var p = projById[t.project]; return !!(p && p.canEdit); }
function canUpdate(t) { return canEdit(t) || t.owner === S.data.me.name; }
function isPM() { return S.data.me.role !== '美術'; }
function projName(id) { return (projById[id] || {}).name || id; }
function pcolor(id) { var p = projById[id]; if (p && p.color) return p.color; var i = S.data.projects.findIndex(function (x) { return x.id === id; }); return PALETTE[(i < 0 ? 0 : i) % PALETTE.length]; }
function statusPill(s) { return '<span class="pill st-' + esc(s) + '">' + esc(s) + '</span>'; }

/* ============== 載入 ============== */
function load(history) {
  busy(true);
  return call('getData', { history: !!history }).then(function (d) {
    S.data = d; index();
    $('#meName').textContent = d.me.name; $('#meRole').textContent = d.me.role;
    $('#tabAdmin').classList.toggle('hidden', d.me.role === '美術');

/* ============== 人員排程 ============== */

    ts.forEach(function (t) { if (t.mode === '平行' || t.status === '完成') return; var a = Math.max(dn(t.start), today), b = Math.min(dn(t.end), today + 29); if (b < a) return; var span = 0, all = 0; for (var n = dn(t.start); n <= dn(t.end); n++) if (!isOff(n)) { all++; if (n >= a && n <= b) span++; } used += all ? Number(t.days) * span / all : 0; });
    return { p: p, ts: ts, lanes: Math.max(1, lanes.length), cap: cap, used: used };
  });
  var top = 0;
  layout.forEach(function (L) { L.top = top; L.h = Math.max(42, L.lanes * LH + 8); top += L.h; });
  var width = (max - min + 1) * W;
  if (!layout.length) { m.innerHTML = h + '<div class="card empty">這段期間沒有排程。</div>'; bindPeople(); return; }

  layout.forEach(function (L) {

  });

    if (W >= 20) h += '<div style="left:' + x(n) + 'px;top:24px;width:' + W + 'px;text-align:center;' + (isOff(n) ? 'color:#adb5bd' : '') + '">' + dd + '</div>';
    else if (wk(n) === 1) h += '<div style="left:' + x(n) + 'px;top:24px">' + md(s) + '</div>';

  for (n = min; n <= max; n++) if (isOff(n)) h += '<div class="gday off" style="left:' + x(n) + 'px;width:' + W + 'px"></div>';
  h += '<div class="gtoday" style="left:' + (x(today) + W / 2) + 'px"></div>';
  layout.forEach(function (L) {
    h += '<div class="prow" style="top:' + L.top + 'px;height:' + L.h + 'px"></div>';
    d.leaves.forEach(function (l) {
      if (l.person !== L.p.name) return;

      if (b < a) return;
      h += '<div class="leave" style="left:' + x(a) + 'px;width:' + ((b - a + 1) * W) + 'px;top:' + L.top + 'px;height:' + L.h + 'px" title="' + esc((l.type || '休假') + ' ' + l.start + '~' + l.end + ' ' + (l.note || '')) + '"></div>';
    });
    L.ts.forEach(function (t) {

    });

  h += '<div class="legend" style="margin-top:8px">' + d.projects.filter(function (p) { return p.status !== '封存'; }).map(function (p) { return '<span><i style="background:' + pcolor(p.id) + '"></i>' + esc(p.name) + '</span>'; }).join('') + '<span><i style="background:rgba(47,158,68,.25)"></i>休假</span><span><i style="background:#f1f3f5"></i>假日</span></div>';

  gl.addEventListener('wheel', function (e) { gr.scrollTop += e.deltaY; e.preventDefault(); }, { passive: false });

  $$('.pname', m).forEach(function (el) { el.addEventListener('click', function () { openQueue(el.dataset.p); }); });

function bindPredInput() {

  };

  h += '<label>狀態<select class="field" id="pjStatus">' + ['進行中', '暫停', '封存'].map(function (s) { return '<option' + (s === p.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></label>';
  h += '<label>PM（人名，多位用逗號；留空＝所有 PM 都能改）<input class="field" id="pjPm" value="' + esc(p.pm) + '"' + (admin ? '' : ' disabled') + '></label>';
  h += '<label>開始日<input class="field" type="date" id="pjStart" value="' + esc(p.start) + '"></label><label>目標日<input class="field" type="date" id="pjTarget" value="' + esc(p.target) + '"></label>';
  h += '<label>顏色<input class="field" type="color" id="pjColor" value="' + esc(p.color || '#4dabf7') + '"></label><label>備註<input class="field" id="pjNote" value="' + esc(p.note) + '"></label></div>';
  h += '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" id="pjGo">儲存</button>' + (!isNew ? '<button class="btn" id="pjBase">重設基準</button>' : '') + '<button class="btn" id="pjC">取消</button></div>';
  if (!isNew) h += '<div class="hint" style="margin-top:8px">「重設基準」會把目前的預計完成日存成基準，之後延誤會顯示「比基準晚 N 天」。建議在專案計畫確定、或每個版本開始時按一次。</div>';
  modal(h);
  $('#pjC').addEventListener('click', closeModal);
  $('#pjGo').addEventListener('click', function () {
    var o = { id: p.id, name: $('#pjName').value.trim(), code: $('#pjCode').value.trim(), status: $('#pjStatus').value, start: $('#pjStart').value, target: $('#pjTarget').value, color: $('#pjColor').value, note: $('#pjNote').value };
    if (admin) o.pm = $('#pjPm').value.trim();
    busy(true);
    call('saveProject', o).then(function (r) {
      var i = S.data.projects.findIndex(function (x) { return x.id === r.id; });
      if (i >= 0) S.data.projects[i] = r; else S.data.projects.push(r);
      index(); S.project = r.id; busy(false); closeModal(); toast('已儲存專案'); render();
    }).catch(fail);
  });
  var b = $('#pjBase');
  if (b) b.addEventListener('click', function () {
    if (!confirm('把「' + p.name + '」所有未完成工項的基準完成日，改成目前的預計完成日？')) return;
    busy(true);
    call('resetBaseline', p.id).then(function (r) { applyComputed(r.computed); busy(false); closeModal(); toast('已重設 ' + r.count + ' 個工項的基準'); render(); }).catch(fail);
  });
}

/* ============== 管理（PM／管理員） ============== */
function renderAdmin(m) {
  var admin = S.data.me.role === '管理員';
  var h = '<div class="toolbar"><b style="font-size:16px">管理</b><span class="grow"></span>' + (S.data.sheetUrl ? '<a class="btn" target="_blank" href="' + esc(S.data.sheetUrl) + '">開啟資料庫後台（Supabase）</a>' : '') + '</div>';
  if (admin) {
    h += '<div class="card" style="padding:14px 16px;margin-bottom:14px"><h3 style="margin:0 0 6px;font-size:15px">匯入資料</h3>';
    h += '<div class="hint">選擇「美術專案管理DB.xlsx」，或從 Google 試算表「檔案 → 下載 → Microsoft Excel」下載的檔案。<b style="color:var(--danger)">匯入會清空並取代資料庫裡現有的全部工項、專案、人員、行事曆、休假和範本。</b></div>';
    h += '<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><input type="file" id="impFile" accept=".xlsx"><button class="btn primary" id="impGo" disabled>匯入</button></div><div id="impRes" style="margin-top:10px;font-size:13px"></div></div>';
  }
  h += '<div class="card" style="padding:14px 16px"><h3 style="margin:0 0 6px;font-size:15px">異動紀錄 <span class="faint" style="font-weight:400;font-size:12px">最近 300 筆</span></h3><div id="logBox" class="muted">載入中…</div></div>';
  h += '<div class="hint" style="margin-top:10px">人員、Email、角色、行事曆、範本和設定，請在資料庫後台的 Table Editor 直接修改（像試算表一樣）。改完按右上角 ↻ 重新整理。</div>';
  m.innerHTML = h;
  call('getLog', 300).then(function (rows) {
    var box = $('#logBox'); if (!box) return;
    box.innerHTML = rows.length ? '<div class="tablewrap" style="max-height:60vh"><table class="tasks" style="min-width:760px"><thead><tr><th>時間</th><th>使用者</th><th>動作</th><th>對象</th><th>ID</th><th>內容</th></tr></thead><tbody>' + rows.map(function (r) {
      var t = new Date(new Date(r.at).getTime() + 8 * 3600000).toISOString().slice(0, 16).replace('T', ' ');
      return '<tr><td class="date">' + t + '</td><td>' + esc(r.email) + '</td><td>' + esc(r.action) + '</td><td>' + esc(r.kind) + '</td><td>' + esc(r.ref) + '</td><td style="white-space:pre-wrap">' + esc(r.content) + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '還沒有紀錄。';
  }).catch(function (e) { var box = $('#logBox'); if (box) box.textContent = e.message; });
  var f = $('#impFile');
  if (f) {
    var parsed = null;
    f.addEventListener('change', function () {
      parsed = null; $('#impGo').disabled = true; $('#impRes').textContent = '讀取中…';
      var file = f.files[0]; if (!file) return;
      need('XLSX').then(function () { return file.arrayBuffer(); }).then(function (buf) {
        parsed = API.parseWorkbook(buf);
        var c = parsed.counts;
        $('#impRes').innerHTML = '讀到：工項 <b>' + c.tasks + '</b>、專案 ' + c.projects + '、人員 ' + c.people + '、行事曆 ' + c.calendar + '、休假 ' + c.leaves + '、範本步驟 ' + c.templates +
          (parsed.warn.length ? '<div class="warnbox" style="margin-top:8px">' + parsed.warn.map(esc).join('<br>') + '</div>' : '');
        $('#impGo').disabled = false;
      }).catch(function (e) { $('#impRes').innerHTML = '<span class="late">' + esc(e.message) + '</span>'; });
    });
    $('#impGo').addEventListener('click', function () {
      if (!parsed || !confirm('確定要清空資料庫並匯入這個檔案？')) return;
      busy(true);
      call('importPayload', parsed.payload).then(function (r) { busy(false); toast('已匯入 ' + r.tasks + ' 個工項'); load(false); }).catch(fail);
    });
  }
}

/* ============== 其他人修改時自動更新 ============== */
API.onChange(function (ev) {
  if (!S.data) return;
  if (ev.reload) { load(S.data.history); return; }
  ev.removed.forEach(function (id) { S.data.tasks = S.data.tasks.filter(function (t) { return t.id !== id; }); });
  ev.tasks.forEach(upsert);
  index();
  applyComputed(ev.computed);
  if (syncCount) return;          // 自己還有存檔在排隊，等完成後再畫
  if ($('#drawer').classList.contains('open') || $('.modal')) return;
  if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#main').contains(document.activeElement)) return;
  render();
});

/* ============== 登入與啟動 ============== */
function screen(html) { busy(false); $('#tabs').classList.add('hidden'); $('#main').innerHTML = '<div class="card" style="max-width:460px;margin:60px auto;padding:28px 30px;line-height:1.8">' + html + '</div>'; }
$('#logout').addEventListener('click', function () { API.signOut(); });
API.init().then(function (r) {
  if (r.state === 'config') return screen('<h2 style="margin-top:0">還沒設定資料庫</h2>請在 <code>js/config.js</code> 填入 Supabase 的網址和 anon key。');
  if (r.state === 'login') {
    $('#logout').classList.add('hidden');
    screen('<h2 style="margin-top:0">美術專案管理</h2><p class="muted">請用公司的 Google 帳號登入。</p><button class="btn primary" id="loginBtn" style="width:100%;min-height:42px">使用 Google 帳號登入</button>');
    $('#loginBtn').addEventListener('click', function () { API.signIn(); });
    return;
  }
  if (r.state === 'denied') return screen('<h2 style="margin-top:0">沒有使用權限</h2><p>你的帳號（' + esc(r.email) + '）不在「人員」名單上，或還沒填 Email。</p><p>請聯絡管理員把你加入名單，或按右上角「登出」換一個帳號。</p>');
  $('#tabs').classList.remove('hidden');
  load(false);
}).catch(function (e) { screen('<h2 style="margin-top:0">連線失敗</h2>' + esc(e.message)); });
</script>
</body>
</html>
